<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Students — Sarvpratham Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
      <img src="/sarvpratham-logo.png" style="max-height: 48px; background: white; border-radius: 8px; padding: 6px; margin-bottom: 10px;" alt="Sarvpratham logo" />
      <span style="font-size: 0.9rem; color: #fff;">Admin Console</span>
    </div>
    <a href="/admin/index.html">Dashboard</a>
    <a href="/admin/purchases.html">Purchases</a>
    <a href="/admin/cart-tracking.html">Cart & Checkout</a>
    <a href="/admin/leads.html">Leads</a>
    <a href="/admin/students.html" class="active">Students</a>
    <a href="/admin/courses.html">Courses</a>
    <a href="/admin/categories.html">Categories</a>
    <a href="/admin/coupons.html">Coupons</a>
    <a href="/admin/testimonials.html">Testimonials</a>
    <a href="/admin/settings.html">Site Settings</a>
    <a href="#" data-logout class="logout">Log out</a>
  </aside>
  <main class="main">
    <h1>Students Directory</h1>
    <p class="subtitle">Complete directory of students registered on the platform</p>
    <div class="toolbar" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <select id="filter-purchase" style="padding: 8px 12px; border: 1px border; border-radius: 6px; font-weight: 500;">
        <option value="all">All Students</option>
        <option value="active">Active (Purchased)</option>
        <option value="inactive">Inactive (No Purchase)</option>
        <option value="guest">Guest (Not Activated)</option>
      </select>
      <button id="btn-export" class="btn-ghost" style="padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">Export CSV</button>
    </div>
    <div id="table-wrap"></div>
  </main>
</div>

<div class="overlay" id="access-overlay">
  <div class="modal" style="width:460px">
    <h2 id="access-modal-title">Manage course access</h2>
    <p class="subtitle" style="margin-top:-8px;margin-bottom:12px">Toggle a course to instantly grant or remove this student's access.</p>
    <div id="access-course-list" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto"></div>
    <div class="error-msg" id="access-error"></div>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="access-close-btn">Close</button>
    </div>
  </div>
</div>

<script src="/admin/admin.js"></script>
<script>
  let students = [];

  function render() {
    const wrap = document.getElementById("table-wrap");
    if (students.length === 0) {
      wrap.innerHTML = `<div class="empty">No registered students yet.</div>`;
      return;
    }

    const filter = document.getElementById("filter-purchase").value;
    const filtered = students.filter((s) => {
      const hasPurchased = (s.purchasedCourses || []).length > 0;
      if (filter === "active") return hasPurchased;
      if (filter === "inactive") return !hasPurchased;
      if (filter === "guest") return s.isActivated === false;
      return true;
    });

    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="empty">No students match this filter.</div>`;
      return;
    }

    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>Name</th><th>Email</th><th>Phone</th><th>Location</th><th>Account</th><th>Purchased Courses</th><th>Registered</th><th></th>
        </tr></thead>
        <tbody>
          ${filtered.map((s) => `
            <tr data-id="${s._id}">
              <td style="font-weight:600">${escapeHtml(s.name)}</td>
              <td>${escapeHtml(s.email)}</td>
              <td>${escapeHtml(s.phone) || "—"}</td>
              <td>${s.city || s.state ? `${escapeHtml(s.city || "")}${s.city && s.state ? ", " : ""}${escapeHtml(s.state || "")}` : '<span class="muted italic">&mdash;</span>'}</td>
              <td>
                ${s.isActivated === false
                  ? '<span class="badge" style="background:#fef9c3;color:#854d0e;font-weight:700">Guest (Pending)</span>'
                  : '<span class="badge" style="background:#dcfce7;color:#166534;font-weight:700">Activated</span>'
                }
              </td>
              <td>
                ${(s.purchasedCourses || []).length > 0
                  ? (s.purchasedCourses || []).map(slug => `<span class="badge badge-contacted" style="margin-right:4px">${escapeHtml(slug)}</span>`).join("")
                  : '<span class="muted">None yet</span>'
                }
              </td>
              <td class="muted">${new Date(s.createdAt).toLocaleDateString()}</td>
              <td style="white-space:nowrap">
                <button class="btn-ghost btn-sm" data-manage="${s._id}">Manage Access</button>
                <button class="btn-danger btn-sm" data-delete="${s._id}">Delete</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll("[data-delete]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this student account? All access will be revoked.")) return;
        await api(`/students/${btn.dataset.delete}`, { method: "DELETE" });
        await load();
      });
    });

    wrap.querySelectorAll("[data-manage]").forEach((btn) => {
      btn.addEventListener("click", () => openAccessModal(students.find((s) => s._id === btn.dataset.manage)));
    });
  }

  let courses = [];
  let managingStudentId = null;

  function renderAccessList(student) {
    const list = document.getElementById("access-course-list");
    if (courses.length === 0) {
      list.innerHTML = `<p class="muted" style="font-size:0.85rem">No courses exist yet.</p>`;
      return;
    }
    const owned = new Set(student.purchasedCourses || []);
    list.innerHTML = courses.map((c) => `
      <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer">
        <input type="checkbox" data-course-slug="${escapeHtml(c.slug)}" ${owned.has(c.slug) ? "checked" : ""} />
        <span style="flex-grow:1;font-size:0.85rem;font-weight:600">${escapeHtml(c.title)}</span>
        <code style="font-size:0.72rem;color:#64748b">${escapeHtml(c.slug)}</code>
      </label>
    `).join("");

    list.querySelectorAll("input[type=checkbox]").forEach((checkbox) => {
      checkbox.addEventListener("change", async (e) => {
        const slug = e.target.dataset.courseSlug;
        const errorEl = document.getElementById("access-error");
        errorEl.textContent = "";
        e.target.disabled = true;
        try {
          if (e.target.checked) {
            await api(`/students/${managingStudentId}/grant-access`, { method: "POST", body: JSON.stringify({ courseSlug: slug }) });
            student.purchasedCourses = [...(student.purchasedCourses || []), slug];
          } else {
            await api(`/students/${managingStudentId}/revoke-access`, { method: "POST", body: JSON.stringify({ courseSlug: slug }) });
            student.purchasedCourses = (student.purchasedCourses || []).filter((s) => s !== slug);
          }
          const idx = students.findIndex((s) => s._id === managingStudentId);
          if (idx !== -1) students[idx] = student;
          render();
        } catch (err) {
          errorEl.textContent = err.message;
          e.target.checked = !e.target.checked;
        } finally {
          e.target.disabled = false;
        }
      });
    });
  }

  function openAccessModal(student) {
    managingStudentId = student._id;
    document.getElementById("access-modal-title").textContent = `Manage access — ${student.name}`;
    document.getElementById("access-error").textContent = "";
    renderAccessList(student);
    document.getElementById("access-overlay").classList.add("open");
  }

  function closeAccessModal() {
    document.getElementById("access-overlay").classList.remove("open");
    managingStudentId = null;
  }

  document.getElementById("access-close-btn").addEventListener("click", closeAccessModal);
  document.getElementById("access-overlay").addEventListener("click", (e) => {
    if (e.target.id === "access-overlay") closeAccessModal();
  });

  async function load() {
    [students, courses] = await Promise.all([api("/students"), api("/courses")]);
    render();
  }

  (async () => {
    await requireAuth();
    wireLogout();
    document.getElementById("filter-purchase").addEventListener("change", render);
    document.getElementById("btn-export").addEventListener("click", () => {
      const headers = [
        { key: "name", label: "Name" },
        { key: "email", label: "Email" },
        { key: "phone", label: "Phone" },
        { key: "city", label: "City" },
        { key: "state", label: "State" },
        { key: "isActivated", label: "Activated" },
        { key: "purchasedCourses", label: "Purchased Courses" },
        { key: "createdAt", label: "Registration Date" }
      ];
      const filter = document.getElementById("filter-purchase").value;
      const filtered = students.filter((s) => {
        const hasPurchased = (s.purchasedCourses || []).length > 0;
        if (filter === "active") return hasPurchased;
        if (filter === "inactive") return !hasPurchased;
        if (filter === "guest") return s.isActivated === false;
        return true;
      });
      downloadCSV(filtered, `students_${filter}.csv`, headers);
    });
    await load();
  })();
</script>
</body>
</html>
