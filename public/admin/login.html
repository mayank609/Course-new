<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sarvpratham Admin — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="login-form">
    <div style="text-align: center; margin-bottom: 20px;">
      <img src="/sarvpratham-logo.png" style="max-height: 48px; background: white; border-radius: 8px; padding: 6px;" alt="Sarvpratham logo" />
    </div>
    <h1 style="font-size: 1.25rem;">Admin Console</h1>
    <p class="subtitle">Sign in to manage courses, leads &amp; sales</p>
    <div class="error-msg" id="error"></div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn-primary" style="width:100%">Sign in</button>
  </form>
</div>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Login failed");
      window.location.href = "/admin/index.html";
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
