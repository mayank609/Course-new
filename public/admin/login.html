<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sarvpratham Admin — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="login-form">
    <div style="text-align: center; margin-bottom: 20px;">
      <img src="/sarvpratham-logo.png" style="max-height: 48px; background: white; border-radius: 8px; padding: 6px;" alt="Sarvpratham logo" />
    </div>
    <h1 style="font-size: 1.25rem;">Admin Console</h1>
    <p class="subtitle">Sign in to manage courses, leads &amp; sales</p>
    <div class="error-msg" id="error"></div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div style="position:relative">
        <input id="password" type="password" required autocomplete="current-password" style="width:100%;box-sizing:border-box;padding-right:36px" />
        <button type="button" id="toggle-password" aria-label="Show password" style="position:absolute;top:0;right:0;height:100%;width:36px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#64748b">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-primary" style="width:100%">Sign in</button>
  </form>
</div>
<script>
  document.getElementById("toggle-password").addEventListener("click", () => {
    const input = document.getElementById("password");
    const btn = document.getElementById("toggle-password");
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    btn.innerHTML = showing
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Login failed");
      window.location.href = "/admin/index.html";
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
