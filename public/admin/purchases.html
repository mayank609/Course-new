<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Purchases — Sarvpratham Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
      <img src="/sarvpratham-logo.png" style="max-height: 48px; background: white; border-radius: 8px; padding: 6px; margin-bottom: 10px;" alt="Sarvpratham logo" />
      <span style="font-size: 0.9rem; color: #fff;">Admin Console</span>
    </div>
    <a href="/admin/index.html">Dashboard</a>
    <a href="/admin/purchases.html" class="active">Purchases</a>
    <a href="/admin/cart-tracking.html">Cart & Checkout</a>
    <a href="/admin/leads.html">Leads</a>
    <a href="/admin/students.html">Students</a>
    <a href="/admin/courses.html">Courses</a>
    <a href="/admin/categories.html">Categories</a>
    <a href="/admin/coupons.html">Coupons</a>
    <a href="/admin/testimonials.html">Testimonials</a>
    <a href="/admin/settings.html">Site Settings</a>
    <a href="#" data-logout class="logout">Log out</a>
  </aside>
  <main class="main">
    <h1>Student Purchases</h1>
    <p class="subtitle">Complete history of direct course buys</p>
    
    <div class="stats" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 20px;">
      <div class="stat-card"><div class="n" id="total-sales">—</div><div class="l">Total Transactions</div></div>
      <div class="stat-card"><div class="n" id="total-revenue">—</div><div class="l">Total Revenue (INR)</div></div>
      <div class="stat-card"><div class="n" id="ads-percent">—</div><div class="l">From Paid Ads</div></div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <select id="status-filter" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; font-weight: 600;">
          <option value="completed">Completed</option>
          <option value="pending">Pending</option>
          <option value="failed">Failed</option>
          <option value="">All statuses</option>
        </select>
        <select id="source-filter" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; font-weight: 600;">
          <option value="">All sources</option>
        </select>
      </div>
      <button id="btn-export" class="btn-ghost" style="padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">Export CSV</button>
    </div>

    <div id="table-wrap"></div>
  </main>
</div>
<script src="/admin/admin.js"></script>
<script>
  let purchases = [];
  let sourceFilter = "";
  let statusFilter = "completed";

  function statusBadge(status) {
    const s = status || "completed";
    const style = s === "completed"
      ? "background:#dcfce7;color:#166534"
      : s === "pending"
      ? "background:#fef9c3;color:#854d0e"
      : "background:#fee2e2;color:#991b1b";
    return `<span class="badge" style="${style};font-weight:700;text-transform:capitalize">${escapeHtml(s)}</span>`;
  }

  function sourceBadge(source) {
    const label = source || "Direct / Website";
    const isAds = /ads/i.test(label);
    const isDirect = /^direct/i.test(label);
    const isOrganic = /organic|social|referral/i.test(label);
    const style = isAds
      ? "background:#fee2e2;color:#991b1b"
      : isDirect
      ? "background:#e0f2fe;color:#075985"
      : isOrganic
      ? "background:#dcfce7;color:#166534"
      : "background:#f1f5f9;color:#475569";
    return `<span class="badge" style="${style};font-weight:700;white-space:nowrap">${escapeHtml(label)}</span>`;
  }

  function populateSourceFilter() {
    const select = document.getElementById("source-filter");
    const sources = Array.from(new Set(purchases.map((p) => p.source || "Direct / Website"))).sort();
    const current = sourceFilter;
    select.innerHTML =
      `<option value="">All sources</option>` +
      sources.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
    select.value = current;
  }

  function render() {
    populateSourceFilter();

    const wrap = document.getElementById("table-wrap");

    // Stats always reflect real completed sales, regardless of which status the table is filtered to.
    const completed = purchases.filter((p) => (p.status || "completed") === "completed");
    const totalRev = completed.reduce((sum, p) => sum + (p.amount || 0), 0);
    const adsCount = completed.filter((p) => /ads/i.test(p.source || "")).length;
    const adsPercent = completed.length ? Math.round((adsCount / completed.length) * 100) : 0;
    document.getElementById("total-sales").textContent = completed.length;
    document.getElementById("total-revenue").textContent = "₹" + totalRev.toLocaleString();
    document.getElementById("ads-percent").textContent = adsPercent + "%";

    let filtered = statusFilter ? purchases.filter((p) => (p.status || "completed") === statusFilter) : purchases;
    filtered = sourceFilter ? filtered.filter((p) => (p.source || "Direct / Website") === sourceFilter) : filtered;

    if (purchases.length === 0) {
      wrap.innerHTML = `<div class="empty">No purchases recorded yet.</div>`;
      return;
    }
    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="empty">No purchases match this filter.</div>`;
      return;
    }

    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>Transaction ID</th><th>Student Name</th><th>Student Email / Phone</th><th>Billing Location</th><th>Course</th><th>Amount</th><th>Status</th><th>Source</th><th>Date</th><th></th>
        </tr></thead>
        <tbody>
          ${filtered.map((p) => `
            <tr data-id="${p._id}">
              <td><code style="background:#eee;padding:2px 6px;border-radius:4px">${escapeHtml(p.paymentId)}</code></td>
              <td>
                ${escapeHtml(p.studentName)}
                ${p.isGuestPurchase ? `<div><span class="badge" style="background:#e0e7ff;color:#3730a3;font-weight:700;font-size:0.68rem">Guest</span></div>` : ""}
              </td>
              <td>
                ${escapeHtml(p.studentEmail)}
                ${p.studentPhone ? `<div class="muted" style="font-size:0.78rem;margin-top:2px">📞 ${escapeHtml(p.studentPhone)}</div>` : ""}
              </td>
              <td>
                ${p.studentState || p.studentCity || p.studentPincode ? `
                  <div style="font-weight:500">
                    ${escapeHtml(p.studentCity || "")}${p.studentCity && p.studentState ? ", " : ""}${escapeHtml(p.studentState || "")}
                  </div>
                  ${p.studentPincode ? `<div class="muted" style="font-size:0.78rem;margin-top:2px">PIN: ${escapeHtml(p.studentPincode)}</div>` : ""}
                ` : `<span class="muted italic">&mdash;</span>`}
              </td>
              <td class="muted">${escapeHtml(p.courseTitle)}</td>
              <td style="font-weight:600">₹${p.amount}</td>
              <td>${statusBadge(p.status)}</td>
              <td>${sourceBadge(p.source)}</td>
              <td class="muted">${new Date(p.createdAt).toLocaleString()}</td>
              <td><button class="btn-danger btn-sm" data-delete="${p._id}">Delete</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll("[data-delete]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this purchase transaction? This will not revoke the student access, only delete the transaction log.")) return;
        await api(`/purchases/${btn.dataset.delete}`, { method: "DELETE" });
        await load();
      });
    });
  }

  async function load() {
    purchases = await api("/purchases");
    render();
  }

  (async () => {
    await requireAuth();
    wireLogout();
    document.getElementById("status-filter").addEventListener("change", (e) => {
      statusFilter = e.target.value;
      render();
    });
    document.getElementById("source-filter").addEventListener("change", (e) => {
      sourceFilter = e.target.value;
      render();
    });
    document.getElementById("btn-export").addEventListener("click", () => {
      const headers = [
        { key: "paymentId", label: "Transaction ID" },
        { key: "studentName", label: "Student Name" },
        { key: "isGuestPurchase", label: "Guest Purchase" },
        { key: "studentEmail", label: "Student Email" },
        { key: "studentPhone", label: "Student Phone" },
        { key: "studentCity", label: "City" },
        { key: "studentState", label: "State" },
        { key: "studentPincode", label: "Pincode" },
        { key: "courseTitle", label: "Course" },
        { key: "amount", label: "Amount" },
        { key: "status", label: "Status" },
        { key: "source", label: "Source" },
        { key: "utmSource", label: "UTM Source" },
        { key: "utmMedium", label: "UTM Medium" },
        { key: "utmCampaign", label: "UTM Campaign" },
        { key: "createdAt", label: "Purchase Date" }
      ];
      let toExport = statusFilter ? purchases.filter((p) => (p.status || "completed") === statusFilter) : purchases;
      toExport = sourceFilter ? toExport.filter((p) => (p.source || "Direct / Website") === sourceFilter) : toExport;
      downloadCSV(toExport, `purchases_${statusFilter || "all"}.csv`, headers);
    });
    await load();
  })();
</script>
</body>
</html>
