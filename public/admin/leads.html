<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Leads — Sarvpratham Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
      <img src="/sarvpratham-logo.png" style="max-height: 48px; background: white; border-radius: 8px; padding: 6px; margin-bottom: 10px;" alt="Sarvpratham logo" />
      <span style="font-size: 0.9rem; color: #fff;">Admin Console</span>
    </div>
    <a href="/admin/index.html">Dashboard</a>
    <a href="/admin/purchases.html">Purchases</a>
    <a href="/admin/leads.html" class="active">Leads</a>
    <a href="/admin/courses.html">Courses</a>
    <a href="/admin/categories.html">Categories</a>
    <a href="/admin/testimonials.html">Testimonials</a>
    <a href="#" data-logout class="logout">Log out</a>
  </aside>
  <main class="main">
    <h1>Leads</h1>
    <p class="subtitle">Every enquiry submitted from the website</p>
    <div class="toolbar">
      <select id="filter-source">
        <option value="">All sources</option>
        <option value="newsletter">Newsletter</option>
        <option value="contact">Contact</option>
        <option value="corporate">Corporate</option>
        <option value="enterprise">Enterprise</option>
        <option value="interview-prep">BootCamps</option>
        <option value="course-enquiry">Course Enquiry</option>
      </select>
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="closed">Closed</option>
      </select>
    </div>
    <div id="table-wrap"></div>
  </main>
</div>
<script src="/admin/admin.js"></script>
<script>
  let leads = [];

  function badge(status) {
    return `<span class="badge badge-${status}">${status}</span>`;
  }

  function render() {
    const wrap = document.getElementById("table-wrap");
    if (leads.length === 0) {
      wrap.innerHTML = `<div class="empty">No leads match these filters.</div>`;
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>Name</th><th>Email</th><th>Phone</th><th>Source</th><th>Course</th><th>Status</th><th>Received</th><th></th>
        </tr></thead>
        <tbody>
          ${leads.map((l) => `
            <tr data-id="${l._id}">
              <td>${escapeHtml(l.name) || "—"}</td>
              <td>${escapeHtml(l.email)}</td>
              <td>${escapeHtml(l.phone) || "—"}</td>
              <td>${escapeHtml(l.source)}</td>
              <td class="muted">${escapeHtml(l.courseTitle) || "—"}</td>
              <td>
                <select class="status-select" data-id="${l._id}">
                  <option value="new" ${l.status === "new" ? "selected" : ""}>New</option>
                  <option value="contacted" ${l.status === "contacted" ? "selected" : ""}>Contacted</option>
                  <option value="closed" ${l.status === "closed" ? "selected" : ""}>Closed</option>
                </select>
              </td>
              <td class="muted">${new Date(l.createdAt).toLocaleDateString()}</td>
              <td><button class="btn-danger btn-sm" data-delete="${l._id}">Delete</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll(".status-select").forEach((sel) => {
      sel.addEventListener("change", async () => {
        await api(`/leads/${sel.dataset.id}`, { method: "PATCH", body: JSON.stringify({ status: sel.value }) });
      });
    });
    wrap.querySelectorAll("[data-delete]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this lead?")) return;
        await api(`/leads/${btn.dataset.delete}`, { method: "DELETE" });
        await load();
      });
    });
  }

  async function load() {
    const source = document.getElementById("filter-source").value;
    const status = document.getElementById("filter-status").value;
    const params = new URLSearchParams();
    if (source) params.set("source", source);
    if (status) params.set("status", status);
    leads = await api(`/leads?${params.toString()}`);
    render();
  }

  (async () => {
    await requireAuth();
    wireLogout();
    document.getElementById("filter-source").addEventListener("change", load);
    document.getElementById("filter-status").addEventListener("change", load);
    await load();
  })();
</script>
</body>
</html>
